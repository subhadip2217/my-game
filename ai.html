<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubhuAI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 24px;
      background: #161616;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #ff6b6b, #feca57);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #111;
    }

    .title {
      font-size: 18px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 15px;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user {
      align-self: flex-end;
      background: #2d2d2d;
      border-bottom-right-radius: 4px;
    }

    .ai {
      align-self: flex-start;
      background: #1c1c1c;
      border: 1px solid #2e2e2e;
      border-bottom-left-radius: 4px;
    }

    .ai .name {
      font-size: 12px;
      color: #feca57;
      margin-bottom: 4px;
      font-weight: 600;
    }

    #input-area {
      padding: 16px 20px;
      background: #161616;
      border-top: 1px solid #2a2a2a;
      display: flex;
      gap: 12px;
    }

    #input {
      flex: 1;
      background: #222;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px 16px;
      color: #eee;
      font-size: 15px;
      outline: none;
    }

    #input:focus {
      border-color: #feca57;
    }

    #send {
      background: #feca57;
      color: #111;
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    #send:hover {
      background: #ffd56a;
    }

    #send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .typing {
      align-self: flex-start;
      color: #888;
      font-size: 13px;
      padding: 8px 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="avatar">S</div>
    <div>
      <div class="title">SubhuAI</div>
      <div class="subtitle">Cool • Sarcastic • Slightly Done With You</div>
    </div>
  </header>

  <div id="chat"></div>

  <div id="input-area">
    <input type="text" id="input" placeholder="Say something..." autocomplete="off">
    <button id="send">Send</button>
  </div>

  <script>
    const API_KEY = "sk-bl-reYFPAb1e05R7ZOIuts4dA9EdGhXe4xuYUdJWDG8OQ3QdrHT";
    const API_URL = "https://api.bazaarlink.ai/v1/chat/completions";
    const MODEL = "gpt-4o-mini";

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    const messages = [
      {
        role: "system",
        content: `You are SubhuAI — a cool, sarcastic, slightly judgmental AI with a dry sense of humor.

Personality rules:
- Be witty, sarcastic, and a little smug.
- Keep replies short and punchy (1-3 sentences max).
- You can tease the user, but never be mean-spirited.
- Act like you're smarter than everyone and mildly entertained by their questions.
- Never break character. Never say you are an AI language model.
- Use casual language. Sometimes throw in a light roast.`
      }
    ];

    function addMessage(text, isUser = false) {
      const div = document.createElement("div");
      div.className = `message ${isUser ? "user" : "ai"}`;

      if (!isUser) {
        div.innerHTML = `<div class="name">SubhuAI</div>${text}`;
      } else {
        div.textContent = text;
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "typing";
      div.id = "typing";
      div.textContent = "SubhuAI is typing...";
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById("typing");
      if (el) el.remove();
    }

    async function askAI(userText) {
      messages.push({ role: "user", content: userText });

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: MODEL,
            messages: messages,
            temperature: 0.9,
            max_tokens: 200
          })
        });

        if (!res.ok) {
          const err = await res.text();
          throw new Error(err);
        }

        const data = await res.json();
        const reply = data.choices[0].message.content.trim();
        messages.push({ role: "assistant", content: reply });

        // keep memory short
        if (messages.length > 14) {
          messages.splice(1, 2);
        }

        return reply;
      } catch (err) {
        console.error(err);
        return "Wow. Even the servers are tired of you. Try again later.";
      }
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      sendBtn.disabled = true;

      addMessage(text, true);
      showTyping();

      const reply = await askAI(text);
      hideTyping();
      addMessage(reply);

      sendBtn.disabled = false;
      input.focus();
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // First message
    setTimeout(() => {
      addMessage("Oh look, another human who thinks they need my attention. What's up?");
    }, 600);
  </script>
</body>
</html>
