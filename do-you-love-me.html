<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do you love me, Pushpita?</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 font-size=%2280%22><text y=%2285%22>💗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#ffe3ec;
    --bg-2:#ff9dbb;
    --rose:#e63950;
    --rose-dark:#c41c3d;
    --plum:#4a0e2e;
    --cream:#fff6f8;
    --gold:#ffc94a;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:'Quicksand', sans-serif;
  }

  body{
    background:linear-gradient(160deg, var(--bg-1), var(--bg-2) 70%);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  .stage{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .scene{
    text-align:center;
    padding:2rem 1.5rem;
    max-width:640px;
    width:100%;
    transition:opacity .5s ease, transform .5s ease;
  }

  .scene.hidden{ display:none; }
  .scene.fade-out{ opacity:0; transform:scale(.96); }

  .eyebrow{
    letter-spacing:.2em;
    text-transform:uppercase;
    font-size:.7rem;
    font-weight:700;
    color:var(--rose-dark);
    opacity:.75;
    margin:0 0 .5rem;
  }

  .headline{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:clamp(2.6rem, 9vw, 5rem);
    line-height:1.05;
    color:var(--plum);
    margin:0 0 .75rem;
  }

  .headline .name{
    color:var(--rose);
    position:relative;
  }

  .caption{
    font-weight:600;
    color:var(--plum);
    opacity:.8;
    font-size:clamp(.95rem, 2.5vw, 1.15rem);
    min-height:1.6em;
    margin:0 0 1.75rem;
    transition:opacity .2s ease;
  }

  .button-row{
    display:flex;
    gap:1.25rem;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
  }

  .btn{
    border:none;
    border-radius:999px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:1.15rem;
    padding:.85rem 2.2rem;
    cursor:pointer;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease, background .3s ease;
    will-change:transform;
  }

  .btn.yes{
    background:linear-gradient(135deg, var(--rose), var(--rose-dark));
    color:var(--cream);
    box-shadow:0 8px 24px -6px rgba(230,57,80,.55);
    transform-origin:center;
  }
  .btn.yes:hover{ box-shadow:0 12px 30px -6px rgba(230,57,80,.7); }
  .btn.yes:active{ transform:scale(.96) !important; }

  .btn.no{
    background:transparent;
    color:var(--plum);
    border:2px solid var(--plum);
    opacity:.85;
    z-index:5;
    transform-origin:center;
    transition:left .18s ease, top .18s ease, transform .18s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
  }

  @media (prefers-reduced-motion: reduce){
    .btn.no{ transition:opacity .3s ease; }
  }

  .counter{
    margin-top:1.25rem;
    font-size:.8rem;
    font-weight:600;
    color:var(--plum);
    opacity:.55;
    min-height:1.2em;
  }

  /* Reveal scene */
  .reveal .big-heart{
    font-size:clamp(3rem, 12vw, 5rem);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.15); }
  }
  .reveal{ opacity:0; transform:scale(.9); }
  .reveal.visible{ opacity:1; transform:scale(1); }

  /* Ambient + effect hearts */
  .floating-heart, .puff-heart, .confetti-heart{
    position:fixed;
    pointer-events:none;
    user-select:none;
    z-index:1;
  }
  .floating-heart{
    bottom:-10vh;
    animation:floatUp linear forwards;
    opacity:.5;
  }
  @keyframes floatUp{
    to{ transform:translateY(-120vh) rotate(20deg); opacity:0; }
  }

  .puff-heart{ z-index:6; animation:puff .6s ease-out forwards; }
  @keyframes puff{
    to{ transform:translate(var(--dx), var(--dy)) scale(0); opacity:0; }
  }

  .confetti-heart{ top:-5vh; z-index:9; animation:confettiFall linear forwards; }
  @keyframes confettiFall{
    to{ transform:translateY(115vh) rotate(var(--rot)); opacity:0; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <div class="scene" id="scene1">
    <p class="eyebrow">an important question</p>
    <h1 class="headline">Do you love me,<br><span class="name">Pushpita</span>?</h1>
    <p class="caption" id="caption">Take your time... or don't.</p>
    <div class="button-row">
      <button class="btn yes" id="yesBtn">Yes 💗</button>
      <button class="btn no" id="noBtn">No</button>
    </div>
    <p class="counter" id="counter"></p>
  </div>

  <div class="scene reveal hidden" id="scene2">
    <div class="big-heart">💗</div>
    <h1 class="headline">I love you too,<br><span class="name">Pushpita</span>!</h1>
    <p class="caption">Forever and always. 💌</p>
  </div>

</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const scene1 = document.getElementById('scene1');
  const scene2 = document.getElementById('scene2');
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const caption = document.getElementById('caption');
  const counter = document.getElementById('counter');

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const captions = [
    "Take your time... or don't.",
    "Hmm, tried to click No?",
    "Not so fast.",
    "That button is camera-shy.",
    "It's playing hard to get.",
    "Okay this is getting impressive.",
    "You're really committed to this.",
    "No is basically retired now.",
    "Face it — the answer's obvious.",
    "Yes is right there, you know."
  ];

  let attempts = 0;
  let dodging = false;

  function safeBounds(rect){
    const margin = 12;
    const maxX = Math.max(margin, window.innerWidth - rect.width - margin);
    const maxY = Math.max(margin, window.innerHeight - rect.height - margin);
    return {
      x: margin + Math.random() * (maxX - margin),
      y: margin + Math.random() * (maxY - margin)
    };
  }

  function spawnPuff(x, y){
    if (reducedMotion) return;
    for(let i=0;i<6;i++){
      const h = document.createElement('span');
      h.className = 'puff-heart';
      h.textContent = '💔';
      h.style.left = x + 'px';
      h.style.top = y + 'px';
      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 40;
      h.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      h.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      h.style.fontSize = (10 + Math.random()*8) + 'px';
      document.body.appendChild(h);
      h.addEventListener('animationend', () => h.remove());
    }
  }

  function updateAfterAttempt(){
    const idx = Math.min(attempts, captions.length - 1);
    caption.textContent = captions[idx];
    const scaleYes = Math.min(1 + attempts * 0.07, 2.3);
    const scaleNo = Math.max(1 - attempts * 0.05, 0.4);
    yesBtn.style.transform = `scale(${scaleYes})`;
    noBtn.style.transform = `scale(${scaleNo})`;
    noBtn.style.opacity = Math.max(0.9 - attempts * 0.03, 0.5);
    counter.textContent = attempts > 0 ? `Escape attempts: ${attempts}` : '';
  }

  function dodge(){
    if (dodging) return;
    dodging = true;
    const rect = noBtn.getBoundingClientRect();
    spawnPuff(rect.left + rect.width/2, rect.top + rect.height/2);
    const pos = safeBounds(rect);
    noBtn.style.position = 'fixed';
    noBtn.style.left = pos.x + 'px';
    noBtn.style.top = pos.y + 'px';
    attempts++;
    updateAfterAttempt();
    setTimeout(() => { dodging = false; }, 120);
  }

  function nearNo(clientX, clientY){
    const rect = noBtn.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    const dist = Math.hypot(clientX - cx, clientY - cy);
    return dist < 95;
  }

  document.addEventListener('pointermove', (e) => {
    if (nearNo(e.clientX, e.clientY)) dodge();
  });

  noBtn.addEventListener('click', (e) => {
    e.preventDefault();
    dodge();
  });

  noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    dodge();
  }, { passive:false });

  function burstConfetti(){
    const count = reducedMotion ? 10 : 34;
    const emojis = ['💗','💖','💘','💕','✨'];
    for(let i=0;i<count;i++){
      const h = document.createElement('span');
      h.className = 'confetti-heart';
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      h.style.left = Math.random()*100 + 'vw';
      h.style.fontSize = (14 + Math.random()*20) + 'px';
      h.style.setProperty('--rot', (Math.random()*360-180) + 'deg');
      const dur = 2.6 + Math.random()*2.2;
      h.style.animationDuration = dur + 's';
      h.style.animationDelay = (Math.random()*0.6) + 's';
      document.body.appendChild(h);
      h.addEventListener('animationend', () => h.remove());
    }
  }

  yesBtn.addEventListener('click', () => {
    scene1.classList.add('fade-out');
    setTimeout(() => {
      scene1.classList.add('hidden');
      scene2.classList.remove('hidden');
      requestAnimationFrame(() => scene2.classList.add('visible'));
      burstConfetti();
    }, 480);
  });

  // Ambient floating hearts
  if (!reducedMotion){
    const emojis = ['💗','💓','💕'];
    setInterval(() => {
      if (document.hidden) return;
      const h = document.createElement('span');
      h.className = 'floating-heart';
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      h.style.left = Math.random()*100 + 'vw';
      h.style.fontSize = (14 + Math.random()*16) + 'px';
      const dur = 8 + Math.random()*6;
      h.style.animationDuration = dur + 's';
      document.body.appendChild(h);
      h.addEventListener('animationend', () => h.remove());
    }, 900);
  }
})();
</script>

</body>
</html>
