<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just For You ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
background-size:400% 400%;
animation:bg 12s infinite alternate;
}

@keyframes bg{
0%{background-position:0% 50%;}
100%{background-position:100% 50%;}
}

.container{
width:90%;
max-width:600px;
padding:35px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
border-radius:20px;
text-align:center;
color:white;
box-shadow:0 10px 30px rgba(0,0,0,.3);
animation:pop 1s;
}

@keyframes pop{
from{
transform:scale(.5);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

h1{
font-size:2.3em;
margin-bottom:20px;
}

#typing{
font-size:1.3em;
min-height:80px;
margin-bottom:30px;
}

button{
padding:14px 35px;
font-size:18px;
border:none;
border-radius:40px;
cursor:pointer;
background:#ff4081;
color:white;
transition:.4s;
}

button:hover{
transform:scale(1.08);
background:#e91e63;
}

#hidden{
display:none;
margin-top:30px;
font-size:22px;
animation:fade 1s;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.heart{
position:absolute;
color:white;
font-size:22px;
animation:float 7s linear infinite;
opacity:.8;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(0);
}
100%{
transform:translateY(-120vh) scale(1.5);
}
}
</style>
</head>

<body>

<div class="container">

<h1>🌸 Hello, Mimi 🌸</h1>

<div id="typing"></div>

<button onclick="showMessage()">Click Here ❤️</button>

<div id="hidden">
🌹

You have a beautiful smile.

I just wanted to say...

✨ Keep smiling, because it makes the world brighter.

😊❤️
</div>

</div>

<script>

const text="Sometimes one conversation can make an ordinary day feel a little more special...";
let i=0;

function type(){
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(type,55);
}
}

type();

function showMessage(){
document.getElementById("hidden").style.display="block";
confetti();
}

function createHeart(){

const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML=["❤","💖","💕","💗","🌸"][Math.floor(Math.random()*5)];
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(15+Math.random()*30)+"px";
heart.style.animationDuration=(5+Math.random()*4)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);

}

setInterval(createHeart,250);

function confetti(){

for(let j=0;j<120;j++){

let c=document.createElement("div");

c.innerHTML="✨";
c.style.position="absolute";
c.style.left=Math.random()*100+"vw";
c.style.top=Math.random()*100+"vh";
c.style.fontSize=(10+Math.random()*25)+"px";
c.style.transition="all 2s";
document.body.appendChild(c);

setTimeout(()=>{
c.style.transform=`translate(${Math.random()*300-150}px,${Math.random()*300-150}px) rotate(720deg)`;
c.style.opacity=0;
},50);

setTimeout(()=>{
c.remove();
},2200);

}

}

</script>

</body>
</html>
